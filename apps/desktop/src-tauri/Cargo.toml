[package]
name = "clef-crossy-road"
version = "0.1.0"
description = "Clef plays a deterministic port of Expo Crossy Road"
edition = "2021"
publish = false

[lib]
name = "ccr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
tauri-plugin-os = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
