<!DOCTYPE html>
<!--
  Source of how-clef-plays-light.png and how-clef-plays-dark.png (README "How Clef plays").
  Drawn by hand in the style of diagram-design (github.com/cathrynlavery/diagram-design): one direction of flow,
  4px grid, hairlines, no shadows, a single accent for the model. To re-export, screenshot the <svg> at 2x with the
  browser in light and in dark colour scheme.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Clef plays</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f5f5f5; --node: #ffffff; --ink: #2d3142; --soft: #5a6580;
      --rule: rgba(45, 49, 66, 0.12); --rule-solid: #bfc0c0; --accent: #bf4520; --accent-tint: rgba(191, 69, 32, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #2d3142; --node: #353a4e; --ink: #f5f5f5; --soft: #a9b1c4;
        --rule: rgba(245, 245, 245, 0.12); --rule-solid: rgba(191, 192, 192, 0.35); --accent: #f08a59;
        --accent-tint: rgba(240, 138, 89, 0.12);
      }
    }
    body { margin: 0; padding: 24px; background: transparent; }
    svg { display: block; width: 960px; }
    .paper { fill: var(--paper); }
    .node { fill: var(--node); stroke: var(--rule-solid); stroke-width: 1; }
    .clef { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.25; }
    .wire { fill: none; stroke: var(--rule-solid); stroke-width: 1.5; }
    .head { fill: var(--rule-solid); }
    .title { font: 600 15px Geist, system-ui, sans-serif; fill: var(--ink); }
    .title.accent { fill: var(--accent); }
    .sub { font: 400 11px "Geist Mono", ui-monospace, monospace; fill: var(--soft); }
    .label { font: 400 11px "Geist Mono", ui-monospace, monospace; fill: var(--soft); }
    .foot { font: 400 12.5px Geist, system-ui, sans-serif; fill: var(--soft); }
    .rule { stroke: var(--rule); stroke-width: 1; }
  </style>
</head>
<body>
<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clefplay-title clefplay-desc">
  <title id="clefplay-title">How Clef plays one step</title>
  <desc id="clefplay-desc">Code turns the game into words, Clef-flash answers four one-word questions, and its answer hops, waits or goes round; then the next step starts.</desc>
  <defs>
    <marker id="clefplay-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path class="head" d="M0 0 L8 4 L0 8 Z"/></marker>
  </defs>

  <rect class="paper" width="960" height="360" rx="12"/>

  <!-- flow: game -> words -> Clef -> branch -->
  <path class="wire" d="M192 152 H230" marker-end="url(#clefplay-arrow)"/>
  <path class="wire" d="M392 152 H430" marker-end="url(#clefplay-arrow)"/>
  <path class="wire" d="M608 152 H670" marker-end="url(#clefplay-arrow)"/>
  <path class="wire" d="M640 152 V80 Q640 72 648 72 H670" marker-end="url(#clefplay-arrow)"/>
  <path class="wire" d="M640 152 V224 Q640 232 648 232 H670" marker-end="url(#clefplay-arrow)"/>

  <!-- loop back to the game -->
  <path class="wire" d="M880 72 H904 Q912 72 912 80 V280 Q912 288 904 288 H120 Q112 288 112 280 V190" marker-end="url(#clefplay-arrow)"/>
  <path class="wire" d="M880 152 H912"/>
  <path class="wire" d="M880 232 H912"/>
  <rect class="paper" x="420" y="278" width="152" height="20"/>
  <text class="label" x="496" y="292" text-anchor="middle">next step, 0.2 s later</text>

  <!-- the game -->
  <rect class="node" x="32" y="116" width="160" height="72" rx="10"/>
  <text class="title" x="112" y="148" text-anchor="middle">The game</text>
  <text class="sub" x="112" y="168" text-anchor="middle">seeded · 60 Hz</text>

  <!-- the screen in words -->
  <rect class="node" x="232" y="116" width="160" height="72" rx="10"/>
  <text class="title" x="312" y="148" text-anchor="middle">Screen to words</text>
  <text class="sub" x="312" y="168" text-anchor="middle">lands_on: water</text>

  <!-- Clef-flash -->
  <rect class="clef" x="432" y="116" width="176" height="72" rx="10"/>
  <text class="title accent" x="520" y="148" text-anchor="middle">Ask Clef-flash</text>
  <text class="sub" x="520" y="168" text-anchor="middle">4 one-word questions</text>

  <!-- outcomes -->
  <rect class="node" x="672" y="44" width="208" height="56" rx="10"/>
  <text class="title" x="776" y="68" text-anchor="middle">Hop now</text>
  <text class="sub" x="776" y="86" text-anchor="middle">if it can land ahead</text>

  <rect class="node" x="672" y="124" width="208" height="56" rx="10"/>
  <text class="title" x="776" y="148" text-anchor="middle">Wait, then ask again</text>
  <text class="sub" x="776" y="166" text-anchor="middle">if the row ahead moves</text>

  <rect class="node" x="672" y="204" width="208" height="56" rx="10"/>
  <text class="title" x="776" y="228" text-anchor="middle">Go round</text>
  <text class="sub" x="776" y="246" text-anchor="middle">if closed · code walks it</text>

  <!-- footnote -->
  <line class="rule" x1="32" y1="316" x2="928" y2="316"/>
  <text class="foot" x="32" y="340">Clef never sees “safe”, valid moves or time to collision, and nothing checks its answer.</text>
</svg>
</body>
</html>
