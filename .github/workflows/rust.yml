name: Rust

# The Tauri backend's tests only change when its crate does, so this runs for changes under
# src-tauri, weekly (toolchain drift, and it keeps the build cache from expiring) and by hand.
on:
  push:
    branches: [main]
    paths: ["apps/desktop/src-tauri/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["apps/desktop/src-tauri/**", ".github/workflows/rust.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux compiles and tests linux.rs and the unix credential path; Windows is the verified app.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: node scripts/init.mjs --desktop
      # Tauri embeds ../dist when the crate compiles, so the web build comes first.
      - run: pnpm --filter @ccr/desktop build
      - name: Install the Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          # Main and the weekly run save; branches and pull requests restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --lib
        working-directory: apps/desktop/src-tauri
