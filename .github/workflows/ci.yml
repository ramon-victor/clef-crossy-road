name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so new runner images, toolchains or a moved asset source show up without a commit.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64 runners can queue for 10+ minutes or not be assigned at all, so pushes and
        # pull requests check Linux and Windows (about 2 minutes); weekly and manual runs add macOS.
        os: >-
          ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request')
          && '["ubuntu-latest", "windows-latest"]'
          || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      # The README's quick start: installs with the frozen lockfile and fetches the game assets.
      - name: Init
        if: runner.os != 'Windows'
        run: ./init.sh
      - name: Init
        if: runner.os == 'Windows'
        run: .\init.cmd
      - run: pnpm check
      - run: node scripts/gen-flow-figure.mjs --check
      - run: pnpm --filter @ccr/desktop build
